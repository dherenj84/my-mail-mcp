# Configure the trigger with a dedicated build service account; see docs/deployment.md.
# Substitutions contain configuration and secret references, never secret values.
steps:
  - id: checks
    name: python:3.12-slim
    entrypoint: bash
    env:
      - UV_PROJECT_ENVIRONMENT=/tmp/my-mail-mcp-checks
    args:
      - -ceu
      - |
        python -m pip install --no-cache-dir --disable-pip-version-check uv==0.13.4
        uv sync --locked
        uv run --locked ruff check src tests
        uv run --locked ruff format --check src tests
        uv run --locked pytest -q

  - id: build
    name: gcr.io/cloud-builders/docker
    env:
      - DOCKER_BUILDKIT=1
    args:
      - build
      - --tag
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE}:$BUILD_ID
      - .

  # Cloud Run needs the image before the final `images` upload takes place.
  - id: push
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE}:$BUILD_ID

  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --project=$PROJECT_ID
      - --region=${_REGION}
      - --platform=managed
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE}:$BUILD_ID
      - --service-account=${_RUNTIME_SERVICE_ACCOUNT}
      - --port=8080
      - --cpu=1
      - --memory=512Mi
      - --min=0
      # Extra CPU only while a cold instance starts.
      - --cpu-boost
      - --max=${_MAX_INSTANCES}
      - --concurrency=10
      - --timeout=300
      - --ingress=all
      # Cloud Run admits requests; FastMCP checks the application's bearer token.
      - --no-invoker-iam-check
      - --update-env-vars=AUTH_ISSUER_URL=${_AUTH_ISSUER_URL},PUBLIC_BASE_URL=${_PUBLIC_BASE_URL}
      - --update-secrets=MAIL_ACCOUNTS=${_MAIL_ACCOUNTS_SECRET},MCP_AUTH_TOKEN=${_MCP_AUTH_TOKEN_SECRET}
      - --quiet

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE}:$BUILD_ID

substitutions:
  _REGION: us-central1
  _REPOSITORY: my-mail-mcp
  _SERVICE: my-mail-mcp
  _RUNTIME_SERVICE_ACCOUNT: my-mail-mcp-runtime@${PROJECT_ID}.iam.gserviceaccount.com
  _MAX_INSTANCES: '3'
  # The two values below belong to the repository owner's Auth0 tenant and service.
  # Override both in your trigger or build substitutions (see docs/auth0-setup.md).
  _AUTH_ISSUER_URL: https://dev-fh3rg5w3wwzzwzgs.us.auth0.com/
  _PUBLIC_BASE_URL: https://my-mail-mcp-1080363999711.us-central1.run.app
  # Resolve the latest secret versions when Cloud Run instances start.
  # JSON list of mailboxes (see README); hosts, ports and folders are set per account.
  _MAIL_ACCOUNTS_SECRET: my-mail-mcp-accounts:latest
  _MCP_AUTH_TOKEN_SECRET: my-mail-mcp-token:latest

options:
  dynamicSubstitutions: true
  logging: CLOUD_LOGGING_ONLY

timeout: 1200s
