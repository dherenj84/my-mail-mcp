[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "my-mail-mcp"
version = "0.1.0"
description = "A self-hosted MCP server for your mailbox"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "certifi>=2026.10.19",
    "fastmcp==4.1.3",
    "imapclient>=3,<4",
    "pydantic-settings>=2,<3",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[project.scripts]
my-mail-mcp = "my_mail_mcp.server:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
